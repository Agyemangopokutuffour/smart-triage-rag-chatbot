<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Triage - HealthBot</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .container {
        width: 100%;
        max-width: 600px;
        height: 80vh;
        background: white;
        border-radius: 20px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
        color: white;
        padding: 20px;
        text-align: center;
        border-bottom: 4px solid #0056b3;
      }

      .header h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 4px;
      }

      .header p {
        font-size: 14px;
        opacity: 0.9;
      }

      .messages-container {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        display: flex;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.assistant {
        justify-content: flex-start;
      }

      .message-bubble {
        max-width: 75%;
        padding: 12px 16px;
        border-radius: 18px;
        word-wrap: break-word;
        line-height: 1.5;
        font-size: 15px;
      }

      .message.user .message-bubble {
        background: #007bff;
        color: white;
        border-bottom-right-radius: 4px;
      }

      .message.assistant .message-bubble {
        background: #f0f0f0;
        color: #333;
        border-bottom-left-radius: 4px;
      }

      .typing-indicator {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 12px 16px;
        background: #f0f0f0;
        border-radius: 18px;
        width: fit-content;
      }

      .typing-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #999;
        animation: typing 1.4s infinite;
      }

      .typing-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          opacity: 0.5;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-10px);
        }
      }

      .input-area {
        padding: 16px;
        border-top: 1px solid #eee;
        display: flex;
        gap: 12px;
        background: #f9f9f9;
      }

      .input-wrapper {
        flex: 1;
        display: flex;
        gap: 8px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 25px;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
      }

      input[type="text"]:focus {
        border-color: #007bff;
        box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
      }

      button {
        background: #007bff;
        color: white;
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.2s,
          transform 0.1s;
        font-size: 20px;
      }

      button:hover:not(:disabled) {
        background: #0056b3;
        transform: scale(1.05);
      }

      button:active:not(:disabled) {
        transform: scale(0.95);
      }

      button:disabled {
        background: #ccc;
        cursor: not-allowed;
      }

      .symptoms-ready {
        background: #d4edda;
        border: 2px solid #28a745;
        padding: 12px 16px;
        border-radius: 12px;
        margin: 12px 0;
        color: #155724;
        font-weight: 600;
        font-size: 14px;
        text-align: center;
        animation: slideIn 0.3s ease-out;
      }

      .error-message {
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 14px;
        margin: 8px 0;
      }

      .api-url-info {
        font-size: 12px;
        color: #666;
        text-align: center;
        padding: 8px;
        background: #f5f5f5;
        border-radius: 8px;
        margin-bottom: 12px;
      }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      @media (max-width: 600px) {
        .container {
          height: 100vh;
          border-radius: 0;
          max-width: 100%;
        }

        .message-bubble {
          max-width: 85%;
          font-size: 14px;
        }

        .header {
          padding: 16px;
        }

        .header h1 {
          font-size: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>💬 HealthBot</h1>
        <p>Smart Triage Assistant</p>
      </div>

      <div class="messages-container scrollbar-hide" id="messagesContainer">
        <div class="api-url-info">
          Connected to:
          <strong id="apiUrlDisplay">http://192.168.100.212:8000</strong>
        </div>
      </div>

      <div class="input-area">
        <div class="input-wrapper">
          <input
            type="text"
            id="messageInput"
            placeholder="Describe how you feel..."
            autocomplete="off"
          />
          <button id="sendBtn" title="Send message">➤</button>
        </div>
      </div>
    </div>

    <script>
      // Configuration
      const API_URL = "http://192.168.100.212:8000";
      const MAX_HISTORY_DISPLAY = 50;

      // State
      let conversationHistory = [];
      let isLoading = false;
      let readySymptoms = null;

      // DOM elements
      const messagesContainer = document.getElementById("messagesContainer");
      const messageInput = document.getElementById("messageInput");
      const sendBtn = document.getElementById("sendBtn");
      const apiUrlDisplay = document.getElementById("apiUrlDisplay");

      // Update API URL display
      apiUrlDisplay.textContent = API_URL;

      // Initial greeting
      function initializeChat() {
        addMessage(
          "assistant",
          "Hello! I'm HealthBot 👋\n\nBefore you go through triage, I'd like to help you describe your symptoms clearly.\n\nWhat brings you to the hospital today?",
        );
      }

      // Add message to UI
      function addMessage(role, content) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role}`;

        const bubble = document.createElement("div");
        bubble.className = "message-bubble";
        bubble.textContent = content;

        messageDiv.appendChild(bubble);
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
      }

      // Show typing indicator
      function showTypingIndicator() {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message assistant";
        messageDiv.id = "typingIndicator";

        const indicator = document.createElement("div");
        indicator.className = "typing-indicator";
        indicator.innerHTML =
          '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

        messageDiv.appendChild(indicator);
        messagesContainer.appendChild(messageDiv);
        scrollToBottom();
      }

      // Remove typing indicator
      function removeTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) {
          indicator.remove();
        }
      }

      // Check if symptoms are ready
      function extractSymptoms(text) {
        const match = text.match(/\[SYMPTOMS READY\]:\s*(.+)/i);
        return match ? match[1].trim() : null;
      }

      // Show symptoms ready badge
      function showSymptomsReadyBadge() {
        const badge = document.createElement("div");
        badge.className = "symptoms-ready";
        badge.textContent = "✅ Symptoms Ready! You can now proceed to triage.";
        messagesContainer.appendChild(badge);
        scrollToBottom();
      }

      // Scroll to bottom
      function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      // Send message
      async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text || isLoading) return;

        messageInput.value = "";
        isLoading = true;
        sendBtn.disabled = true;

        // Add user message
        addMessage("user", text);

        // Show typing indicator
        showTypingIndicator();

        try {
          const response = await fetch(`${API_URL}/chat`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              message: text,
              conversation_history: conversationHistory,
            }),
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();

          // Update history
          conversationHistory = data.updated_history || [];

          // Remove typing indicator
          removeTypingIndicator();

          // Extract and check for symptoms
          const symptoms = extractSymptoms(data.reply);
          if (symptoms) {
            readySymptoms = symptoms;
          }

          // Clean the reply message
          const displayReply = data.reply
            .replace(/\[SYMPTOMS READY\]:\s*.+/i, "")
            .trim();

          // Add assistant message
          addMessage("assistant", displayReply);

          // Show symptoms ready badge if applicable
          if (symptoms) {
            showSymptomsReadyBadge();
          }
        } catch (error) {
          removeTypingIndicator();
          console.error("Chat error:", error);
          addMessage(
            "assistant",
            `⚠️ Connection error: ${error.message}\n\nPlease check:\n1. Backend is running at ${API_URL}\n2. Your network connection\n3. API key is configured`,
          );
        } finally {
          isLoading = false;
          sendBtn.disabled = false;
          messageInput.focus();
        }
      }

      // Event listeners
      sendBtn.addEventListener("click", sendMessage);
      messageInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Focus input on load
      window.addEventListener("load", () => {
        initializeChat();
        messageInput.focus();
      });
    </script>
  </body>
</html>
